# Nginx 配置文件 - Vue 3 SPA 应用
# 使用说明：
# 1. 将 your-domain.com 替换为你的实际域名
# 2. 将此文件复制到服务器：/etc/nginx/sites-available/multiagent-app
# 3. 创建符号链接：sudo ln -s /etc/nginx/sites-available/multiagent-app /etc/nginx/sites-enabled/
# 4. 测试配置：sudo nginx -t
# 5. 重载 Nginx：sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;

    server_name your-domain.com;

    # Let Encrypt 验证目录
    root /var/www/html;

    # 重定向所有 HTTP 流量到 HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name your-domain.com;

    # 网站根目录 - Vue 3 构建后的静态文件
    root /var/www/multiagent-app;
    index index.html;

    # SSL 证书配置 (Let's Encrypt 会自动配置这部分)
    # ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        image/svg+xml;

    # Vue Router history 模式支持
    # 所有路由请求都返回 index.html，由前端路由处理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 访问日志和错误日志
    access_log /var/log/nginx/multiagent-access.log;
    error_log /var/log/nginx/multiagent-error.log;
}
